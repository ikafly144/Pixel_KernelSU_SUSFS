name: Build Pixel 10 (muzel) Kernel

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Kernel Version"
        type: choice
        options:
          - "6.6 (CP3A.260905.009 / 2026-09-05)"
          - "6.12 (Android 17 QPR2 preview)"
          - "All"
        default: "6.6 (CP3A.260905.009 / 2026-09-05)"
      release_type:
        description: "Release Type"
        type: choice
        options:
          - Action
          - Pre-Release
          - Release
        default: Action
      include_modules:
        description: "Include vendor modules (*.ko) in AnyKernel3"
        type: boolean
        default: true
      use_susfs:
        description: "SUSFS (KernelSU-Next + SUSFS)"
        type: boolean
        default: true
      use_nomount:
        description: "NoMount Support"
        type: boolean
        default: true
      use_bbg:
        description: "Baseband Guard (BBG)"
        type: boolean
        default: true
      use_bpf:
        description: "BPF Stack (BTF + eBPF + FUSE-BPF)"
        type: boolean
        default: true
      device_check:
        description: "AnyKernel3 Device Check (frankel, blazer, mustang, muzel)"
        type: boolean
        default: true

jobs:
  resolve-matrix:
    name: Resolve Version Matrix
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set-matrix.outputs.versions }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          case "${{ inputs.kernel_version }}" in
            *"6.6"*)
              echo 'versions=["6.6"]' >> "$GITHUB_OUTPUT"
              ;;
            *"6.12"*)
              echo 'versions=["6.12"]' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'versions=["6.6", "6.12"]' >> "$GITHUB_OUTPUT"
              ;;
          esac

  build-kernel:
    name: Build Kernel ${{ matrix.kernel_ver }}
    needs: resolve-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel_ver: ${{ fromJson(needs.resolve-matrix.outputs.versions) }}
    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true

      - name: Setup Host Build Tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 python3-pip zip unzip git curl jq ca-certificates rsync

      - name: Setup Sources
        shell: bash
        run: |
          ./scripts/setup_sources.sh "${{ matrix.kernel_ver }}"

      - name: Apply Patches (KSU-Next, SUSFS & Configs)
        shell: bash
        run: |
          ./scripts/apply_patches.sh "${{ matrix.kernel_ver }}" \
            "${{ inputs.use_susfs }}" \
            "${{ inputs.use_nomount }}" \
            "${{ inputs.use_bbg }}" \
            "${{ inputs.use_bpf }}"

      - name: Build Pixel 10 Kernel
        shell: bash
        run: |
          ./scripts/build_kernel.sh

      - name: Package AnyKernel3 Zip
        shell: bash
        run: |
          ./scripts/package_anykernel3.sh "${{ matrix.kernel_ver }}" \
            "${{ inputs.include_modules }}" \
            "${{ inputs.device_check }}"

      - name: Upload AnyKernel3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-Pixel10-muzel-v${{ matrix.kernel_ver }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: inputs.release_type != 'Action'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ inputs.release_type }}" = "Pre-Release" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          TAG_NAME="v${{ matrix.kernel_ver }}-$(date -u +%Y%m%d%H%M)"
          gh release create "${TAG_NAME}" "${ZIP_PATH}" \
            --title "Pixel 10 (muzel) Kernel v${{ matrix.kernel_ver }} - KernelSU-Next & SUSFS" \
            --notes "Built for Google Pixel 10 (frankel / muzel platform) with KernelSU-Next & SUSFS." \
            ${PRERELEASE_FLAG} || echo "Release creation completed or skipped."
