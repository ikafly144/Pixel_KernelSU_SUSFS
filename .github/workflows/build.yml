name: Kernel Build Process

permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sublevel:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      variant:
        required: false
        type: string
        default: "Normal"
      feature_set:
        required: true
        type: string
      ksu_branch:
        required: false
        type: string
        default: ""
      susfs_commit:
        required: false
        type: string
        default: ""
      root_flavor:
        required: false
        type: string
        default: "next"
      root_commit:
        required: false
        type: string
        default: ""
      nomount_commit:
        required: false
        type: string
        default: ""
      kernel_patches_commit:
        required: false
        type: string
        default: ""
      anykernel3_commit:
        required: false
        type: string
        default: ""
      droidspaces_commit:
        required: false
        type: string
        default: ""
      brand_name:
        required: false
        type: string
        default: "Wild"
      bypass:
        required: false
        type: boolean
        default: false
      use_cache:
        required: false
        type: boolean
        default: true
      release_type:
        required: false
        type: string
        default: "Action"

jobs:
  build:
    name: Build Pixel 10 (${{ inputs.kernel_version }}.${{ inputs.sublevel }} / ${{ inputs.root_flavor }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"

      - name: Setup more Swap (for LTO & Bazel)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Setup Host Build Tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 python3-pip zip unzip git curl jq ca-certificates rsync

      - name: Setup Sources
        shell: bash
        run: |
          chmod +x ./scripts/*.sh
          ./scripts/setup_sources.sh \
            "${{ inputs.kernel_version }}" \
            "${{ inputs.root_flavor }}" \
            "${{ inputs.root_commit }}" \
            "${{ inputs.susfs_commit }}" \
            "${{ inputs.os_patch_level }}"

      - name: Apply Patches (Root, SUSFS & Configs)
        shell: bash
        run: |
          USE_SUSFS="${{ contains(inputs.feature_set, 'SUSFS') || inputs.feature_set == 'All' }}"
          USE_NOMOUNT="${{ contains(inputs.feature_set, 'NOMOUNT') || inputs.feature_set == 'All' }}"
          USE_BBG="${{ contains(inputs.feature_set, 'BBG') || inputs.feature_set == 'All' }}"
          USE_BPF="${{ contains(inputs.feature_set, 'BPF') || inputs.feature_set == 'All' }}"
          ./scripts/apply_patches.sh \
            "${{ inputs.kernel_version }}" \
            "${USE_SUSFS}" \
            "${USE_NOMOUNT}" \
            "${USE_BBG}" \
            "${USE_BPF}" \
            "${{ inputs.root_flavor }}"

      - name: Restore Bazel Cache
        if: inputs.use_cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/bazel
          key: bazel-pixel10-${{ inputs.kernel_version }}-${{ hashFiles('kernel/common/ack/**', 'kernel/build/**') }}
          restore-keys: |
            bazel-pixel10-${{ inputs.kernel_version }}-

      - name: Build Pixel 10 Kernel
        shell: bash
        run: |
          ./scripts/build_kernel.sh

      - name: Save Bazel Cache
        if: inputs.use_cache
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/bazel
          key: bazel-pixel10-${{ inputs.kernel_version }}-${{ hashFiles('kernel/common/ack/**', 'kernel/build/**') }}

      - name: Package AnyKernel3 Zip
        shell: bash
        run: |
          ./scripts/package_anykernel3.sh \
            "${{ inputs.kernel_version }}" \
            "${{ inputs.sublevel }}" \
            "${{ inputs.os_patch_level }}" \
            "${{ inputs.root_flavor }}" \
            "true" \
            "true"

      - name: Upload AnyKernel3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: inputs.release_type != 'Action'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ inputs.release_type }}" = "Pre-Release" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          TAG_NAME="Pixel10-${{ inputs.kernel_version }}.${{ inputs.sublevel }}-${{ inputs.os_patch_level }}-${{ inputs.root_flavor }}-$(date -u +%Y%m%d%H%M)"
          gh release create "${TAG_NAME}" "${ZIP_PATH}" \
            --title "Pixel 10 (muzel) Kernel ${{ inputs.kernel_version }}.${{ inputs.sublevel }} (${{ inputs.os_patch_level }}) - ${{ inputs.root_flavor }}" \
            --notes "Pixel 10 / 10 Pro (frankel / muzel platform) Kernel build with ${{ inputs.root_flavor }} & SUSFS." \
            ${PRERELEASE_FLAG} || echo "Release created or skipped."
